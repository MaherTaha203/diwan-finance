name: Settlement RPC authorization

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/settlement-rpc-authorization.yml'
  push:
    branches:
      - main
      - 'security/settlement-rpc-role-guards'
    paths:
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/settlement-rpc-authorization.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history for baseline-reference tests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run complete test suite
        run: npm test
