name: Read-only quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and financial invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Node test suite
        run: npm test
      - name: Run FIN2 financial logic checks
        run: node tests/fin2.test.cjs
      - name: Run constitutional verification
        run: node tests/constitutional-verification.cjs
      - name: Run constitutional lab
        run: node lab/run.cjs
