<title>Diwan Navigation Lab — 10 Concepts</title>
<style>
  :root{
    --pg:#0c0e12;--pg2:#14171e;--pcard:#171b22;--ptx:#e9edf3;--ptx2:#97a1ad;--ptx3:#5f6873;--pln:#252b34;--pacc:#CBF000;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Noto Naskh Arabic",serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pg);color:var(--ptx);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .lab{display:grid;grid-template-columns:210px 1fr 300px;min-height:100vh}
  @media(max-width:1080px){.lab{grid-template-columns:1fr}.rail-x,.info{display:none}}

  /* exhibition switcher */
  .rail-x{border-inline-end:1px solid var(--pln);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .rail-x h1{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:0 0 3px}
  .rail-x .sub{font-family:var(--mono);font-size:10px;color:var(--ptx3);text-transform:uppercase;letter-spacing:.15em;margin-bottom:16px}
  .cbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:1px solid transparent;background:transparent;color:var(--ptx2);padding:9px 10px;border-radius:10px;cursor:pointer;font-family:var(--sans);font-size:13px;margin-bottom:3px;transition:background .12s,color .12s}
  .cbtn:hover{background:var(--pg2);color:var(--ptx)}
  .cbtn.on{background:var(--pcard);color:var(--ptx);border-color:var(--pln)}
  .cbtn .nn{font-family:var(--mono);font-size:11px;color:var(--pacc);width:22px}
  .cbtn.on .nn{color:var(--pacc)}
  .cbtn .cn{font-weight:650}
  .scorebtn{margin-top:14px;width:100%;border:1px solid var(--pln);background:transparent;color:var(--ptx2);border-radius:10px;padding:10px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.05em}
  .scorebtn:hover{color:var(--pacc);border-color:var(--pacc)}

  /* center */
  .center{display:flex;flex-direction:column;min-width:0}
  .ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--pln)}
  .seg{display:inline-flex;border:1px solid var(--pln);border-radius:8px;overflow:hidden;background:var(--pg2)}
  .seg button{border:0;background:transparent;color:var(--ptx2);font-family:var(--sans);font-size:11.5px;font-weight:600;padding:6px 10px;cursor:pointer}
  .seg button.on{background:var(--pacc);color:#12160a}
  .clab{font-family:var(--mono);font-size:9.5px;color:var(--ptx3);text-transform:uppercase;letter-spacing:.08em;margin-inline-start:6px}
  .stagewrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;background:
    radial-gradient(circle at 20% 0%,rgba(255,255,255,.02),transparent 60%)}
  .device{width:100%;max-width:960px;height:560px;border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);transition:max-width .3s cubic-bezier(.3,.9,.3,1);position:relative}
  .device.tablet{max-width:720px}.device.mobile{max-width:378px}
  .stage{width:100%;height:100%;position:relative;overflow:hidden}

  /* info panel */
  .info{border-inline-start:1px solid var(--pln);padding:20px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .info .kn{font-family:var(--mono);font-size:10px;color:var(--pacc);letter-spacing:.1em}
  .info h2{font-size:20px;margin:5px 0 2px;letter-spacing:-.02em}
  .info .tag{color:var(--ptx2);font-size:12.5px;margin:0 0 14px}
  .info h3{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ptx3);margin:16px 0 7px;border-top:1px solid var(--pln);padding-top:13px}
  .info p{font-size:12.5px;color:var(--ptx2);margin:0 0 6px}
  .info ul{margin:0;padding-inline-start:16px;font-size:12px;color:var(--ptx2)}.info li{margin:0 0 4px}
  .info ul.pro li{color:#a9d94f}.info ul.con li{color:#d99a6a}
  .rad{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .rad .m{font-family:var(--mono);font-size:10px;background:var(--pg2);border:1px solid var(--pln);border-radius:6px;padding:3px 7px;color:var(--ptx2)}
  .rad .m b{color:var(--ptx);font-weight:700}

  /* scoreboard overlay */
  .board{position:fixed;inset:0;background:rgba(6,8,12,.9);z-index:80;display:none;overflow:auto;padding:40px 20px}
  .board.on{display:block}
  .board .bx{max-width:960px;margin:0 auto}
  .board h2{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .board .sub{color:var(--ptx2);margin:0 0 20px;font-size:14px}
  .board .close{position:fixed;top:22px;inset-inline-end:26px;border:1px solid var(--pln);background:var(--pg2);color:var(--ptx);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--pln)}
  th{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ptx3);font-weight:700}
  td.name{text-align:start;font-weight:700;white-space:nowrap}
  td.tot{font-weight:800;color:var(--pacc);font-variant-numeric:tabular-nums}
  tr.rank1 td{background:rgba(203,240,0,.08)}
  .cell{display:inline-block;width:22px;font-variant-numeric:tabular-nums}
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin:24px 0}
  @media(max-width:720px){.podium{grid-template-columns:1fr}}
  .pod{border:1px solid var(--pln);border-radius:14px;padding:16px;background:var(--pcard)}
  .pod .r{font-family:var(--mono);font-size:11px;color:var(--pacc)}
  .pod h4{margin:4px 0 6px;font-size:16px}
  .pod p{font-size:12px;color:var(--ptx2);margin:0}

  /* ========================================================= CONCEPT SKINS */
  .stage{font-family:var(--sans)}
  /* C1 Meridian */
  .C1{background:#0a1120;display:flex;color:#e7edf6}
  .C1 .rail{width:66px;background:#0c1626;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
  .C1 .rail .t{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:rgba(231,237,246,.7);cursor:pointer;position:relative}
  .C1 .rail .t svg{width:22px;height:22px}
  .C1 .rail .t:hover{background:rgba(255,255,255,.07)}
  .C1 .rail .t.on{background:rgba(255,255,255,.13);color:#fff}
  .C1 .rail .t.on::before{content:'';position:absolute;inset-inline-start:-8px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:#CBF000}
  .C1 .panel{width:216px;background:#14223c;padding:16px 12px;border-inline:1px solid rgba(255,255,255,.08)}
  .C1 .panel .ph{font-size:15px;font-weight:800;color:#fff;padding:4px 8px 12px}
  .C1 .panel .pi{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:9px;color:rgba(231,237,246,.8);font-size:13.5px;cursor:pointer;font-weight:600}
  .C1 .panel .pi svg{width:17px;height:17px}
  .C1 .panel .pi:hover{background:rgba(255,255,255,.06);color:#fff}
  .C1 .panel .pi.on{background:rgba(255,255,255,.1);color:#fff;position:relative}
  .C1 .panel .pi.on::before{content:'';position:absolute;inset-inline-start:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#CBF000}
  .C1.collapsed .panel{display:none}
  .C1 .wk{flex:1;padding:22px}
  /* C2 Ledger */
  .C2{background:#f2eee4;display:flex;color:#20180f;font-family:var(--serif)}
  .C2 .spine{width:250px;padding:26px 0;border-inline-end:1px solid #d8cfba}
  .C2 .spine .bk{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a08b60;padding:0 26px 14px}
  .C2 .row{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:12px;padding:13px 26px;border-top:1px solid #e2dac8;cursor:pointer;position:relative}
  .C2 .row .no{font-family:var(--mono);font-size:12px;color:#b3a074}
  .C2 .row .nm{font-size:16px}
  .C2 .row:hover{background:#ece5d4}
  .C2 .row.on{background:#e8dfc8}
  .C2 .row.on::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:#b8892f}
  .C2 .row.on .nm{font-weight:700}
  .C2 .wk{flex:1;padding:34px}
  .C2 .wk h3{font-size:26px;margin:0 0 3px;border-bottom:2px solid #20180f;padding-bottom:10px;display:inline-block}
  /* C3 Command */
  .C3{background:#0a0b0d;color:#dfe3e8;font-family:var(--mono);display:flex;flex-direction:column}
  .C3 .top{height:46px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #1c1f25}
  .C3 .top .kk{flex:1;display:flex;align-items:center;gap:9px;background:#111318;border:1px solid #232830;border-radius:8px;padding:7px 12px;color:#6c7580;cursor:pointer;font-size:12.5px}
  .C3 .top .kk kbd{margin-inline-start:auto;background:#1a1e24;border:1px solid #2a2f38;border-radius:4px;padding:1px 6px;font-size:10px}
  .C3 .crumb{padding:9px 18px;font-size:11.5px;color:#7b8590;border-bottom:1px solid #14171c}
  .C3 .crumb b{color:#e6a94a}
  .C3 .wk{flex:1;padding:20px;font-family:var(--sans)}
  .C3 .pal{position:absolute;inset:0;background:rgba(4,5,7,.66);display:none;align-items:flex-start;justify-content:center;padding-top:60px}
  .C3 .pal.on{display:flex}
  .C3 .palbx{width:min(440px,90%);background:#0f1116;border:1px solid #2a2f38;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .C3 .palbx input{width:100%;border:0;border-bottom:1px solid #232830;background:transparent;color:#e6ebf1;font-family:var(--mono);font-size:14px;padding:14px 16px;outline:none}
  .C3 .palrow{display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:13px;cursor:pointer;color:#cfd5dd}
  .C3 .palrow:hover,.C3 .palrow.sel{background:#171a20;color:#fff}
  .C3 .palrow .dom{margin-inline-start:auto;color:#6c7580;font-size:10.5px}
  /* C4 Dock */
  .C4{background:linear-gradient(160deg,#1a1d26,#0f1117);color:#e7e9ef;display:flex;flex-direction:column}
  .C4 .wk{flex:1;padding:22px}
  .C4 .dock{align-self:center;margin:0 auto 16px;display:flex;gap:8px;align-items:flex-end;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:20px;padding:10px 12px}
  .C4 .app{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;cursor:pointer;transition:transform .16s cubic-bezier(.3,1.4,.5,1);position:relative}
  .C4 .app svg{width:24px;height:24px}
  .C4 .app:hover{transform:translateY(-10px) scale(1.16)}
  .C4 .app.on::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#fff}
  /* C5 Orbit */
  .C5{background:radial-gradient(circle at 50% 46%,#141b26,#0a0d13 70%);color:#dfe6ee;display:flex;align-items:center;justify-content:center}
  .C5 .orb{position:relative;width:340px;height:340px}
  .C5 .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:#12303a;border:1px solid #1f5566;color:#5fcdb0;display:grid;place-items:center;cursor:pointer;z-index:3;box-shadow:0 0 0 8px rgba(95,205,176,.06)}
  .C5 .hub svg{width:26px;height:26px}
  .C5 .node{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#131922;border:1px solid #232c38;color:#9fb0c3;display:grid;place-items:center;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.1,.4,1),opacity .3s;opacity:0}
  .C5 .node svg{width:22px;height:22px}
  .C5 .orb.bloom .node{opacity:1}
  .C5 .node.on{border-color:#5fcdb0;color:#eafff8;background:#183a3a;transform:scale(1.14) translate(var(--x),var(--y))}
  .C5 .lbl{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:#8fa0b2;font-family:var(--mono)}
  /* C6 Canvas */
  .C6{background:#eaedf1;background-image:radial-gradient(#cfd6de 1px,transparent 1px);background-size:20px 20px;color:#1b2733;position:relative}
  .C6 .plane{position:absolute;inset:0;padding:26px}
  .C6 .zone{position:absolute;width:150px;height:96px;border:1.5px solid #b9c3ce;background:#fff;border-radius:12px;padding:12px;cursor:pointer;box-shadow:0 6px 18px rgba(30,50,80,.08);transition:border-color .15s,box-shadow .15s}
  .C6 .zone:hover{border-color:#3f6fb0}
  .C6 .zone.on{border-color:#2b5aa0;box-shadow:0 0 0 3px rgba(43,90,160,.18)}
  .C6 .zone .zi{color:#3f6fb0}.C6 .zone .zi svg{width:20px;height:20px}
  .C6 .zone .zt{font-weight:700;font-size:13px;margin-top:6px}
  .C6 .zone .zs{font-size:10.5px;color:#6c7a88;font-family:var(--mono)}
  .C6 .mini{position:absolute;inset-inline-end:16px;bottom:16px;width:120px;height:80px;background:rgba(255,255,255,.9);border:1px solid #b9c3ce;border-radius:8px}
  .C6 .mini i{position:absolute;width:14px;height:9px;background:#c3ccd6;border-radius:2px}
  .C6 .mini i.on{background:#2b5aa0}
  /* C7 Timeline */
  .C7{background:#fbfbf9;color:#211d1a;display:flex;flex-direction:column}
  .C7 .axis{display:flex;align-items:center;gap:0;padding:16px 22px 10px;border-bottom:1px solid #eae5df}
  .C7 .per{flex:1;text-align:center;font-family:var(--mono);font-size:11px;color:#9a9186;padding:6px 0;cursor:pointer;border-bottom:2px solid transparent;position:relative}
  .C7 .per.on{color:#7a2e28;border-bottom-color:#7a2e28;font-weight:700}
  .C7 .tracks{flex:1;padding:14px 22px}
  .C7 .trk{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #f0ece6;cursor:pointer}
  .C7 .trk .nm{font-size:14px;font-weight:600}
  .C7 .trk .bar{height:8px;border-radius:4px;background:#e7e0d6}
  .C7 .trk.on .nm{color:#7a2e28}
  .C7 .trk.on .bar{background:#7a2e28}
  /* C8 Deck */
  .C8{background:#141019;color:#f0ecf4;display:flex;flex-direction:column}
  .C8 .strip{display:flex;gap:6px;padding:12px 14px;overflow:auto;border-bottom:1px solid #2a2333}
  .C8 .tab{font-size:11.5px;padding:6px 12px;border-radius:100px;background:#241d30;color:#b7abc6;cursor:pointer;white-space:nowrap}
  .C8 .tab.on{background:#fff;color:#141019;font-weight:700}
  .C8 .deck{flex:1;position:relative;padding:22px;display:flex;align-items:center;justify-content:center}
  .C8 .card{position:absolute;width:270px;height:330px;border-radius:20px;padding:20px;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,.9,.3,1),opacity .3s;display:flex;flex-direction:column;justify-content:space-between}
  .C8 .card .ci svg{width:34px;height:34px}
  .C8 .card h3{font-size:24px;margin:0}
  .C8 .card .cc{font-size:12px;opacity:.85}
  /* C9 Columns */
  .C9{background:#f5f6f8;color:#1e2530;display:flex}
  .C9 .col{width:200px;border-inline-end:1px solid #e2e6ea;overflow:auto;flex:none}
  .C9 .col.detail{flex:1;background:#fff}
  .C9 .col .ch{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#9aa3ad;padding:12px 14px 6px}
  .C9 .col .it{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:13px;cursor:pointer;color:#3a4453}
  .C9 .col .it svg{width:16px;height:16px;color:#8894a1}
  .C9 .col .it:hover{background:#eef1f4}
  .C9 .col .it.on{background:#2b5aa0;color:#fff}.C9 .col .it.on svg{color:#fff}
  .C9 .col .it .cv{margin-inline-start:auto;opacity:.5}
  .C9 .detail{padding:26px}
  /* C10 Zen */
  .C10{background:#0e0f11;color:#e8e9ea;display:flex;align-items:center;justify-content:center;position:relative}
  .C10 .summon{position:absolute;top:18px;inset-inline-start:18px;width:40px;height:40px;border-radius:12px;border:1px solid #23262b;background:#141619;color:#8b929b;display:grid;place-items:center;cursor:pointer;z-index:3}
  .C10 .presence{position:absolute;top:26px;inset-inline-end:22px;font-family:var(--mono);font-size:11px;color:#4d545c}
  .C10 .presence b{color:#c9ccd0}
  .C10 .zi{text-align:center;max-width:60%}
  .C10 .zi .big{font-size:30px;font-weight:300;letter-spacing:-.02em;color:#f3f4f5}
  .C10 .zi .sm{font-size:12px;color:#5f6771;margin-top:6px}
  .C10 .over{position:absolute;inset:0;background:rgba(8,9,10,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:4}
  .C10 .over.on{display:flex}
  .C10 .over .list{display:flex;flex-direction:column;gap:2px;min-width:260px}
  .C10 .over .oi{font-size:20px;font-weight:300;color:#8b929b;padding:9px 14px;border-radius:10px;cursor:pointer;text-align:center;letter-spacing:-.01em}
  .C10 .over .oi:hover{color:#fff}
  .C10 .over .oi.on{color:#fff}.C10 .over .oi.on::after{content:'·';color:#CBF000;margin-inline-start:8px}

  .wk-h{font-size:19px;font-weight:800;margin:0 0 3px}
  .wk-s{font-size:12px;opacity:.7;margin:0 0 16px}
  .wk-bars{display:flex;flex-direction:column;gap:9px;max-width:420px}
  .wk-bars i{height:11px;border-radius:5px;background:currentColor;opacity:.13}
  .wk-bars i:nth-child(1){width:80%}.wk-bars i:nth-child(2){width:60%}.wk-bars i:nth-child(3){width:70%}
</style>

<div class="lab">
  <aside class="rail-x">
    <h1>Diwan Navigation Lab</h1>
    <div class="sub">10 concepts · exhibition</div>
    <div id="switch"></div>
    <button class="scorebtn" id="scoreOpen">◇ التقييم والتوصية</button>
  </aside>

  <main class="center">
    <div class="ctrls">
      <span class="clab">Viewport</span><div class="seg" id="seg-vp"><button data-v="desktop" class="on">Desktop</button><button data-v="tablet">Tablet</button><button data-v="mobile">Mobile</button></div>
      <span class="clab">Theme</span><div class="seg" id="seg-th"><button data-t="dark" class="on">Dark</button><button data-t="light">Light</button></div>
      <span class="clab">Dir</span><div class="seg" id="seg-dir"><button data-d="rtl" class="on">RTL</button><button data-d="ltr">LTR</button></div>
      <span class="clab" id="collabel" style="display:none">State</span><div class="seg" id="seg-col" style="display:none"><button data-c="0" class="on">Expanded</button><button data-c="1">Collapsed</button></div>
    </div>
    <div class="stagewrap"><div class="device" id="device"><div class="stage" id="stage"></div></div></div>
  </main>

  <aside class="info" id="info"></aside>
</div>

<div class="board" id="board"><button class="close" id="scoreClose">✕</button><div class="bx" id="boardbx"></div></div>

<script>
(function(){
  "use strict";
  var P=function(d){return '<svg viewBox="0 0 24 24">'+d+'</svg>';};
  var I={
    ovw:P('<rect x="3" y="3" width="7" height="8" rx="1.4"/><rect x="14" y="3" width="7" height="5" rx="1.4"/><rect x="14" y="11" width="7" height="10" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/>'),
    food:P('<path d="M6 3v8a2 2 0 0 0 4 0V3M8 11v10"/><path d="M15 3c-1.5 0-2 2-2 4s.5 3 2 3 2-1 2-3-.5-4-2-4zM15 13v8"/>'),
    diwan:P('<path d="M3 10l9-6 9 6"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8"/><path d="M3 21h18"/>'),

    stage.className='stage '+c.id+(S.collapsed&&collapsible()?' collapsed':'');
    stage.setAttribute('dir',S.dir);
    // theme: light overrides for concepts that define dark defaults (C1,C4,C5,C8,C10,C3)
    stage.style.filter=(S.theme==='light' && (c.id==='C3'||c.id==='C10')) ? 'invert(1) hue-rotate(180deg)' : '';
    stage.innerHTML=R[c.id]();
    wireStage();
    renderInfo();
    document.getElementById('collabel').style.display=collapsible()?'':'none';
    document.getElementById('seg-col').style.display=collapsible()?'':'none';
  }
  function setMod(id){ S.mod=id; S.page=0; render(); }
  function wireStage(){
    stage.querySelectorAll('[data-m]').forEach(function(el){ el.onclick=function(){
      var c=CN[S.c];
      if(c.id==='C5'){ if(!S.sub.bloom){S.sub.bloom=true;} S.mod=el.getAttribute('data-m'); render(); return; }
      setMod(el.getAttribute('data-m'));
    }; });
    stage.querySelectorAll('[data-p]').forEach(function(el){ el.onclick=function(){ S.page=+el.getAttribute('data-p'); render(); }; });
    var hub=document.getElementById('c5hub'); if(hub) hub.onclick=function(){ S.sub.bloom=!S.sub.bloom; render(); };
    var c3o=document.getElementById('c3open'); if(c3o) c3o.onclick=openC3;
    var c10o=document.getElementById('c10open'); if(c10o) c10o.onclick=function(){ document.getElementById('c10over').classList.add('on'); };
    var c10ov=document.getElementById('c10over'); if(c10ov) c10ov.onclick=function(e){ if(e.target===c10ov) c10ov.classList.remove('on'); };
  }
  function openC3(){ var pal=document.getElementById('c3pal'); pal.classList.add('on'); var inp=document.getElementById('c3inp'); fillC3(''); inp.value=''; setTimeout(function(){inp.focus();},20);
    inp.oninput=function(){fillC3(this.value);}; pal.onclick=function(e){if(e.target===pal)pal.classList.remove('on');}; }
  function fillC3(q){ q=(q||'').trim(); var list=document.getElementById('c3list'); var rows=[];
    M.forEach(function(m){ m.pages.forEach(function(p,i){ var lab=L(p)+' — '+L(m); if(!q||lab.indexOf(q)!==-1) rows.push({m:m.id,p:i,lab:L(p),dom:L(m)}); }); });
    list.innerHTML=rows.slice(0,7).map(function(r,i){return '<div class="palrow'+(i===0?' sel':'')+'" data-m="'+r.m+'" data-p="'+r.p+'">'+r.lab+'<span class="dom">'+r.dom+'</span></div>';}).join('');
    list.querySelectorAll('[data-m]').forEach(function(el){ el.onclick=function(){ S.mod=el.getAttribute('data-m'); S.page=+el.getAttribute('data-p'); document.getElementById('c3pal').classList.remove('on'); render(); }; }); }

  function renderInfo(){
    var c=CN[S.c]; var i=document.getElementById('info');
    var scK=[['vis','هوية'],['read','قراءة'],['ent','مؤسّسي'],['fin','ماليّ'],['scl','توسّع'],['acc','وصوليّة'],['lrn','تعلّم'],['inv','ابتكار'],['lng','ديمومة']];
    i.innerHTML='<div class="kn">CONCEPT '+('0'+(S.c+1)).slice(-2)+' / 10</div><h2>'+L(c.name)+'</h2><p class="tag">'+L(c.tag)+'</p>'
      +'<h3>الفلسفة</h3><p>'+L(c.phil)+'</p>'
      +'<h3>المزايا</h3><ul class="pro">'+c.pro.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
      +'<h3>المقايضات</h3><ul class="con">'+c.con.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
      +'<h3>الاستخدام الأمثل</h3><p>'+L(c.use)+'</p><h3>التوسّع</h3><p>'+L(c.scale)+'</p>'
      +'<h3>التقييم</h3><div class="rad">'+scK.map(function(k){return '<span class="m">'+k[1]+' <b>'+c.sc[k[0]]+'</b></span>';}).join('')+'</div>';
  }

  function buildSwitch(){ var s=document.getElementById('switch'); s.innerHTML=CN.map(function(c,i){return '<button class="cbtn'+(i===0?' on':'')+'" data-i="'+i+'"><span class="nn">'+('0'+(i+1)).slice(-2)+'</span><span class="cn">'+L(c.name)+'</span></button>';}).join('');
    s.querySelectorAll('[data-i]').forEach(function(el){ el.onclick=function(){ S.c=+el.getAttribute('data-i'); S.mod='ovw'; S.page=0; S.collapsed=false; S.sub={}; Array.prototype.forEach.call(s.children,function(x){x.classList.toggle('on',x===el);}); render(); }; }); }

  function board(){
    var ranked=CN.map(function(c,i){return {c:c,i:i,t:total(c.sc)};}).sort(function(a,b){return b.t-a.t;});
    var cols=[['vis','هوية'],['read','قراءة'],['ent','مؤسّسي'],['fin','ماليّ'],['scl','توسّع'],['acc','وصوليّة'],['lrn','تعلّم'],['mnt','صيانة'],['imp','تنفيذ'],['inv','ابتكار'],['lng','ديمومة']];
    var h='<h2>التقييم الموضوعيّ والتوصية</h2><p class="sub">تقييمٌ عبر ١١ محورًا (٠–١٠)، مرجَّحٌ لأولويّات البرمجيّات الماليّة المؤسّسيّة — لا للجمال وحده. الترتيب تنازليّ.</p>';
    h+='<div class="podium">'+ranked.slice(0,3).map(function(r,k){var med=['①','②','③'][k];return '<div class="pod"><div class="r">'+med+' المرتبة '+(k+1)+'</div><h4>'+L(r.c.name)+'</h4><p>'+L(r.c.tag)+'</p></div>';}).join('')+'</div>';
    h+='<table><thead><tr><th class="name">المفهوم</th>'+cols.map(function(c){return '<th>'+c[1]+'</th>';}).join('')+'<th>المرجَّح</th></tr></thead><tbody>';
    ranked.forEach(function(r,k){ h+='<tr class="'+(k===0?'rank1':'')+'"><td class="name">'+('0'+(r.i+1)).slice(-2)+' '+L(r.c.name)+'</td>'+cols.map(function(c){return '<td><span class="cell">'+r.c.sc[c[0]]+'</span></td>';}).join('')+'<td class="tot">'+r.t.toFixed(1)+'</td></tr>'; });
    h+='</tbody></table>';
    h+='<h3 style="font-family:var(--mono);color:var(--ptx3);margin-top:24px">التوصية</h3>'
      +'<p style="color:var(--ptx2);font-size:13px;max-width:70ch">الأقوى ثلاثةً لنظامٍ ماليٍّ مؤسّسيٍّ طويل الأمد: <b style="color:var(--ptx)">'+L(ranked[0].c.name)+'</b> كعمودٍ فقريّ (وضوحٌ وتوسّعٌ وديمومة)، و<b style="color:var(--ptx)">'+L(ranked[1].c.name)+'</b> للهرميّة العميقة، و<b style="color:var(--ptx)">'+L(ranked[2].c.name)+'</b> للهوية/السرعة كطبقةٍ مُسرِّعة. البُعدُ الابتكاريّ وحده (المدار/اللوح/المجموعة) مثيرٌ بصريًّا لكنه يخسر في المؤسّسيّة والتوسّع والوصوليّة.</p>';
    document.getElementById('boardbx').innerHTML=h;
  }
  document.getElementById('scoreOpen').onclick=function(){ board(); document.getElementById('board').classList.add('on'); };
  document.getElementById('scoreClose').onclick=function(){ document.getElementById('board').classList.remove('on'); };

  function seg(id,fn){ document.getElementById(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});fn(b);}); }
  seg('seg-vp',function(b){S.vp=b.getAttribute('data-v');render();});
  seg('seg-th',function(b){S.theme=b.getAttribute('data-t');render();});
  seg('seg-dir',function(b){S.dir=b.getAttribute('data-d');render();});
  seg('seg-col',function(b){S.collapsed=b.getAttribute('data-c')==='1';render();});

  buildSwitch(); render();
})();
</script>
