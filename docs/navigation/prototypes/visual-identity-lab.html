<title>Diwan Visual Identity Lab — 10 Design Systems</title>
<style>
  :root{
    --pg:#0c0e12;--pg2:#14171e;--pcard:#171b22;--ptx:#e9edf3;--ptx2:#97a1ad;--ptx3:#5f6873;--pln:#252b34;--pacc:#CBF000;
    --usans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
    --umono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--pg);color:var(--ptx);font-family:var(--usans);-webkit-font-smoothing:antialiased;font-size:15px}
  svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .lab{display:grid;grid-template-columns:214px 1fr 292px;min-height:100vh}
  @media(max-width:1120px){.lab{grid-template-columns:1fr}.rail-x,.info{display:none}}
  .rail-x{border-inline-end:1px solid var(--pln);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .rail-x h1{font-size:15px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
  .rail-x .sub{font-family:var(--umono);font-size:10px;color:var(--ptx3);text-transform:uppercase;letter-spacing:.14em;margin-bottom:16px}
  .pbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:start;border:1px solid transparent;background:transparent;color:var(--ptx2);padding:9px 10px;border-radius:10px;cursor:pointer;font-family:var(--usans);font-size:13px;margin-bottom:3px}
  .pbtn:hover{background:var(--pg2);color:var(--ptx)}
  .pbtn.on{background:var(--pcard);color:var(--ptx);border-color:var(--pln)}
  .pbtn .sw{width:22px;height:22px;border-radius:6px;flex:none;border:1px solid rgba(255,255,255,.14)}
  .pbtn .nn{font-family:var(--umono);font-size:10px;color:var(--ptx3);margin-inline-start:auto}
  .center{display:flex;flex-direction:column;min-width:0}
  .ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--pln)}
  .clab{font-family:var(--umono);font-size:9.5px;color:var(--ptx3);text-transform:uppercase;letter-spacing:.08em;margin-inline-start:6px}
  .seg{display:inline-flex;border:1px solid var(--pln);border-radius:8px;overflow:hidden;background:var(--pg2)}
  .seg button{border:0;background:transparent;color:var(--ptx2);font-family:var(--usans);font-size:11.5px;font-weight:600;padding:6px 11px;cursor:pointer}
  .seg button.on{background:var(--pacc);color:#12160a}
  .stagewrap{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center;background:radial-gradient(circle at 30% 0%,rgba(255,255,255,.02),transparent 55%)}
  .frame{width:100%;max-width:1000px;height:640px;border-radius:14px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55)}
  .info{border-inline-start:1px solid var(--pln);padding:20px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .info .kn{font-family:var(--umono);font-size:10px;color:var(--pacc);letter-spacing:.1em}
  .info h2{font-size:19px;margin:5px 0 2px;letter-spacing:-.01em}
  .info .tag{color:var(--ptx2);font-size:12.5px;margin:0 0 12px}
  .info h3{font-family:var(--umono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ptx3);margin:15px 0 6px;border-top:1px solid var(--pln);padding-top:12px}
  .info p{font-size:12.5px;color:var(--ptx2);margin:0 0 5px}
  .swatches{display:flex;gap:6px;margin:8px 0}
  .swatches i{width:26px;height:26px;border-radius:6px;border:1px solid rgba(255,255,255,.12)}
  .kv{font-size:11.5px;color:var(--ptx2);line-height:1.9}.kv b{color:var(--ptx);font-weight:700}

  /* ============================== SHARED PAGE TEMPLATE (themed by --vars) */
  .screen{height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:var(--fnt);font-size:13.5px;--r:12px;--rs:8px;--rp:999px}
  .screen svg{stroke-width:var(--stroke,1.7)}
  .s-search svg{width:15px;height:15px}.s-chip svg{width:14px;height:14px}.btn svg{width:14px;height:14px;vertical-align:-2px}
  .s-hdr{display:flex;align-items:center;gap:14px;padding:0 18px;height:56px;background:var(--surf);border-bottom:1px solid var(--line);flex:none}
  .s-brand{display:flex;align-items:center;gap:9px;font-family:var(--fdisp);font-weight:800;font-size:15px;letter-spacing:var(--brand-ls,-.01em);color:var(--tx)}
  .s-logo{width:28px;height:28px;border-radius:var(--rs);display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:13px}
  .s-search{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--rp);padding:8px 13px;color:var(--tx3);font-size:12.5px}
  .s-hact{margin-inline-start:auto;display:flex;align-items:center;gap:9px}
  .s-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--rs);padding:6px 10px;font-size:12px;color:var(--tx2);font-family:var(--fnum)}
  .s-uav{width:30px;height:30px;border-radius:var(--rs);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:12px}
  .s-body{flex:1;display:flex;min-height:0}
  .s-side{width:212px;background:var(--surf2,var(--surf));border-inline-end:1px solid var(--line);padding:14px 12px;flex:none;overflow:auto}
  .s-side .sc{font-family:var(--fmeta,var(--fnt));font-size:10px;color:var(--tx3);text-transform:var(--meta-tt,uppercase);letter-spacing:var(--meta-ls,.08em);padding:10px 10px 6px}
  .s-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--rs);color:var(--tx2);cursor:pointer;font-size:13px;margin-bottom:2px;position:relative;font-weight:var(--item-w,600)}
  .s-item svg{width:18px;height:18px;opacity:.85}
  .s-item:hover{background:var(--hover)}
  .s-item.on{background:var(--accent-weak);color:var(--accent-strong,var(--accent))}
  .s-item.on svg{opacity:1}
  .s-item.on::before{content:'';position:absolute;inset-inline-start:0;top:7px;bottom:7px;width:var(--marker-w,3px);border-radius:0 3px 3px 0;background:var(--accent)}
  .s-main{flex:1;overflow:auto;padding:var(--main-pad,22px);background:var(--bg)}
  .s-pgh{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px}
  .s-pgh h2{font-family:var(--fdisp);font-size:var(--h2,23px);margin:0;letter-spacing:var(--h2-ls,-.02em);font-weight:var(--h2-w,800)}
  .s-pgh p{margin:3px 0 0;color:var(--tx2);font-size:12.5px}
  .btn{border:1px solid var(--line);background:var(--surf);color:var(--tx);border-radius:var(--rs);padding:9px 15px;font-family:var(--fnt);font-size:12.5px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--btn-shadow,none)}
  .btn.ghost{background:transparent}
  .s-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap,13px);margin-bottom:18px}
  .kpi{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .l{font-size:11px;color:var(--tx3);font-weight:600;font-family:var(--fmeta,var(--fnt));letter-spacing:var(--meta-ls,0);text-transform:var(--kpi-tt,none)}
  .kpi .v{font-family:var(--fnum);font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
  .kpi .sp{position:absolute;inset-inline-end:12px;bottom:12px;color:var(--accent);opacity:.7}
  .cols{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--gap,13px)}
  @media(max-width:640px){.s-kpis{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .card .ch{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px;font-family:var(--fdisp);display:flex;align-items:center;gap:8px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{font-family:var(--fmeta,var(--fnt));text-align:start;font-size:10.5px;color:var(--tx3);text-transform:var(--meta-tt,uppercase);letter-spacing:var(--meta-ls,.05em);padding:9px 16px;background:var(--th-bg,transparent);font-weight:700}
  .tbl td{padding:10px 16px;border-top:1px solid var(--line);color:var(--tx)}
  .tbl td.num{font-family:var(--fnum);font-weight:700;text-align:start}
  .badge{font-size:10px;font-weight:700;border-radius:var(--rp);padding:2px 9px}
  .badge.ok{background:var(--pos-bg);color:var(--pos)}
  .badge.wr{background:var(--warn-bg);color:var(--warn)}
  .s-form{padding:16px}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11px;color:var(--tx2);margin-bottom:5px;font-family:var(--fmeta,var(--fnt));letter-spacing:var(--meta-ls,0);text-transform:var(--meta-tt-lbl,none)}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--rs);padding:9px 11px;color:var(--tx);font-family:var(--fnt);font-size:12.5px}
  .field input:focus{outline:none;border-color:var(--accent)}
  .frow{display:flex;gap:9px;margin-top:4px}

  /* ============================== 10 PERSONALITIES */
  /* 1 Executive Black — Maybach luxury */
  .P1{--bg:#0a0a0b;--surf:#141416;--surf2:#0f0f11;--line:rgba(255,255,255,.09);--tx:#f3f1ec;--tx2:#a7a29a;--tx3:#6b665e;
    --accent:#c8a24a;--accent-ink:#141110;--accent-weak:rgba(200,162,74,.14);--accent-strong:#e2c074;--hover:rgba(255,255,255,.05);
    --pos:#7fca9b;--pos-bg:rgba(127,202,155,.13);--warn:#d9b45a;--warn-bg:rgba(217,180,90,.14);
    --fnt:Georgia,"Noto Naskh Arabic",serif;--fdisp:Georgia,"Noto Naskh Arabic",serif;--fnum:var(--umono);
    --r:12px;--rs:9px;--shadow:0 18px 44px -26px rgba(0,0,0,.8);--h2:26px;--marker-w:2px;--gap:14px}
  /* 2 Swiss Editorial — grid, rules, no shadow */
  .P2{--bg:#ffffff;--surf:#ffffff;--surf2:#fafafa;--line:#111111;--tx:#0d0d0d;--tx2:#4a4a4a;--tx3:#8a8a8a;
    --accent:#e2231a;--accent-ink:#fff;--accent-weak:#fdeceb;--accent-strong:#e2231a;--hover:#f4f4f4;
    --pos:#0a7a3a;--pos-bg:transparent;--warn:#9a6a00;--warn-bg:transparent;
    --fnt:"Helvetica Neue",Arial,"Noto Kufi Arabic",sans-serif;--fdisp:"Helvetica Neue",Arial,"Noto Kufi Arabic",sans-serif;--fnum:"Helvetica Neue",Arial,sans-serif;
    --r:0;--rs:0;--rp:0;--shadow:none;--h2:28px;--h2-w:800;--h2-ls:-.03em;--brand-ls:-.03em;--meta-tt:uppercase;--meta-ls:.14em;--marker-w:0;--gap:0}
  .P2 .kpi,.P2 .card{border-width:1px}.P2 .s-kpis{gap:0;border:1px solid var(--line)}.P2 .kpi{border-width:0;border-inline-start:1px solid var(--line)}.P2 .kpi:first-child{border-inline-start:0}
  .P2 .s-item.on{background:#111;color:#fff}.P2 .badge{border:1px solid currentColor}
  /* 3 Architect Studio — blueprint, technical */
  .P3{--bg:#eef1f3;--surf:#ffffff;--surf2:#f4f6f8;--line:#c9d2da;--tx:#17242f;--tx2:#54626e;--tx3:#8695a1;
    --accent:#0f7fb0;--accent-ink:#fff;--accent-weak:rgba(15,127,176,.1);--accent-strong:#0b658d;--hover:#e7edf1;
    --pos:#1f8a5b;--pos-bg:rgba(31,138,91,.12);--warn:#b47a11;--warn-bg:rgba(180,122,17,.13);
    --fnt:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;--fdisp:"Segoe UI",system-ui,sans-serif;--fnum:var(--umono);
    --r:4px;--rs:3px;--shadow:0 1px 0 rgba(20,40,60,.06);--stroke:1.5;--h2:22px;--meta-tt:uppercase;--meta-ls:.06em;--marker-w:3px}
  .P3 .s-main{background-image:radial-gradient(#d3dbe2 1px,transparent 1px);background-size:18px 18px}
  .P3 .card,.P3 .kpi{box-shadow:none}
  /* 4 Financial Terminal — modern Bloomberg */
  .P4{--bg:#0a0d11;--surf:#0f141a;--surf2:#0c1015;--line:#1c2530;--tx:#d7dee7;--tx2:#8592a0;--tx3:#5b6673;
    --accent:#f2a900;--accent-ink:#12100a;--accent-weak:rgba(242,169,0,.14);--accent-strong:#ffbe2e;--hover:rgba(255,255,255,.04);
    --pos:#2ec27e;--pos-bg:rgba(46,194,126,.14);--warn:#ff5c5c;--warn-bg:rgba(255,92,92,.14);
    --fnt:var(--umono);--fdisp:var(--umono);--fnum:var(--umono);
    --r:4px;--rs:4px;--rp:4px;--shadow:none;--h2:19px;--h2-w:700;--meta-ls:.04em;--main-pad:16px;--gap:8px;--marker-w:3px}
  .P4 .s-item{padding:7px 11px}.P4 .tbl td{padding:7px 16px}.P4 .kpi .v{font-size:20px}
  /* 5 Apple Pro — calm, soft */
  .P5{--bg:#f5f5f7;--surf:#ffffff;--surf2:#fbfbfd;--line:#e5e5ea;--tx:#1d1d1f;--tx2:#6e6e73;--tx3:#a1a1a6;
    --accent:#0071e3;--accent-ink:#fff;--accent-weak:rgba(0,113,227,.1);--accent-strong:#0071e3;--hover:#f0f0f4;
    --pos:#28a745;--pos-bg:rgba(40,167,69,.1);--warn:#c47f17;--warn-bg:rgba(196,127,23,.1);
    --fnt:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",sans-serif;--fdisp:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--fnum:-apple-system,"SF Pro",system-ui,sans-serif;
    --r:16px;--rs:11px;--shadow:0 10px 30px -18px rgba(20,30,50,.22);--h2:24px;--btn-shadow:0 6px 16px -8px rgba(0,113,227,.5);--marker-w:0}
  .P5 .s-item.on{box-shadow:0 4px 12px -8px rgba(0,113,227,.4)}
  /* 6 Luxury Navy — Diwan, elevated */
  .P6{--bg:#0b1428;--surf:#12213c;--surf2:#0e1a30;--line:rgba(160,180,220,.14);--tx:#eaf0f8;--tx2:#a2b3cc;--tx3:#6d7f99;
    --accent:#d8b25a;--accent-ink:#1a1405;--accent-weak:rgba(216,178,90,.14);--accent-strong:#e7c778;--hover:rgba(255,255,255,.05);
    --pos:#69c6a0;--pos-bg:rgba(105,198,160,.14);--warn:#e0b45a;--warn-bg:rgba(224,180,90,.14);
    --fnt:"Segoe UI",system-ui,"Noto Sans Arabic",sans-serif;--fdisp:Georgia,"Noto Naskh Arabic",serif;--fnum:var(--umono);
    --r:14px;--rs:10px;--shadow:0 16px 40px -24px rgba(0,0,0,.6);--h2:24px;--marker-w:3px;--gap:13px}
  .P6 .s-item.on::before{background:linear-gradient(180deg,#d8b25a,#CBF000)}
  /* 7 Museum — gallery, whitespace, serif */
  .P7{--bg:#f7f5ef;--surf:#ffffff;--surf2:#f7f5ef;--line:#e4dfd2;--tx:#191714;--tx2:#6a655c;--tx3:#a49d8d;
    --accent:#8a6d3b;--accent-ink:#fff;--accent-weak:transparent;--accent-strong:#8a6d3b;--hover:#efece3;
    --pos:#4f7a3f;--pos-bg:transparent;--warn:#9a6a2a;--warn-bg:transparent;
    --fnt:Georgia,"Noto Naskh Arabic",serif;--fdisp:"Iowan Old Style",Georgia,"Noto Naskh Arabic",serif;--fnum:Georgia,serif;
    --r:2px;--rs:2px;--rp:0;--shadow:none;--h2:32px;--h2-w:500;--h2-ls:-.01em;--main-pad:34px;--gap:20px;--meta-ls:.18em;--marker-w:0}
  .P7 .card,.P7 .kpi{border-color:var(--line)}.P7 .s-item.on{background:transparent;border-bottom:2px solid var(--accent);border-radius:0}
  .P7 .kpi{border-width:0;border-top:2px solid var(--tx)}
  /* 8 Japanese Minimal — ma, hairline, muted */
  .P8{--bg:#fbfbf9;--surf:#ffffff;--surf2:#fbfbf9;--line:#ececE7;--tx:#1c1b18;--tx2:#8b8981;--tx3:#b3b1a8;
    --accent:#b0402f;--accent-ink:#fff;--accent-weak:rgba(176,64,47,.08);--accent-strong:#b0402f;--hover:#f4f3ef;
    --pos:#5a7a4a;--pos-bg:rgba(90,122,74,.1);--warn:#a5762f;--warn-bg:rgba(165,118,47,.1);
    --fnt:"Hiragino Sans",-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;--fdisp:"Hiragino Mincho ProN",Georgia,serif;--fnum:var(--umono);
    --r:2px;--rs:2px;--shadow:none;--h2:22px;--h2-w:300;--main-pad:30px;--gap:18px;--meta-ls:.1em;--marker-w:2px}
  .P8 .kpi,.P8 .card{border-color:#f0efe9}.P8 .s-item{font-weight:400}
  /* 9 Industrial — utilitarian, hazard */
  .P9{--bg:#15171a;--surf:#1d2024;--surf2:#191c1f;--line:#33383d;--tx:#e7e5e0;--tx2:#9b988f;--tx3:#6c6a63;
    --accent:#e2b400;--accent-ink:#161616;--accent-weak:rgba(226,180,0,.14);--accent-strong:#f0c522;--hover:rgba(255,255,255,.04);
    --pos:#5faa4a;--pos-bg:rgba(95,170,74,.14);--warn:#ff7a2f;--warn-bg:rgba(255,122,47,.16);
    --fnt:var(--umono);--fdisp:"Arial Black",Arial,sans-serif;--fnum:var(--umono);
    --r:2px;--rs:2px;--rp:2px;--shadow:none;--h2:21px;--h2-w:900;--h2-ls:-.02em;--meta-tt:uppercase;--meta-ls:.1em;--marker-w:4px;--gap:10px}
  .P9 .s-logo{border-radius:2px}.P9 .card .ch{text-transform:uppercase;letter-spacing:.06em}
  .P9 .btn.primary{border:2px solid var(--accent)}
  /* 10 Future Corporate — glass, gradient glow */
  .P10{--bg:#0a0b14;--surf:rgba(30,34,58,.55);--surf2:rgba(18,20,36,.6);--line:rgba(150,160,255,.16);--tx:#eef0ff;--tx2:#9aa0c4;--tx3:#6b7098;
    --accent:#7b5cff;--accent-ink:#fff;--accent-weak:rgba(123,92,255,.18);--accent-strong:#a08cff;--hover:rgba(150,160,255,.08);
    --pos:#22d3ee;--pos-bg:rgba(34,211,238,.14);--warn:#ff8bd0;--warn-bg:rgba(255,139,208,.14);
    --fnt:"Century Gothic","URW Gothic",system-ui,"Noto Kufi Arabic",sans-serif;--fdisp:"Century Gothic","URW Gothic",system-ui,sans-serif;--fnum:var(--umono);
    --r:18px;--rs:12px;--shadow:0 20px 50px -24px rgba(80,60,255,.5);--h2:24px;--btn-shadow:0 10px 26px -10px rgba(123,92,255,.7);--marker-w:0;--gap:13px}
  .P10{background:radial-gradient(1000px 500px at 10% -10%,rgba(123,92,255,.18),transparent),radial-gradient(800px 500px at 100% 0%,rgba(34,211,238,.12),transparent),#0a0b14}
  .P10 .s-hdr,.P10 .s-side,.P10 .kpi,.P10 .card,.P10 .s-search{backdrop-filter:blur(14px)}
  .P10 .s-logo{background:linear-gradient(135deg,#7b5cff,#22d3ee)}.P10 .s-uav{background:linear-gradient(135deg,#7b5cff,#22d3ee)}
  .P10 .btn.primary{background:linear-gradient(135deg,#7b5cff,#22d3ee);border:0}
  .P10 .s-item.on{background:var(--accent-weak);box-shadow:0 0 0 1px rgba(123,92,255,.3),0 8px 20px -12px rgba(123,92,255,.6)}
</style>

<div class="lab">
  <aside class="rail-x">
    <h1>Visual Identity Lab</h1>
    <div class="sub">10 design systems · Diwan</div>
    <div id="switch"></div>
  </aside>
  <main class="center">
    <div class="ctrls">
      <span class="clab">Direction</span><div class="seg" id="seg-dir"><button data-d="rtl" class="on">RTL · ع</button><button data-d="ltr">LTR · EN</button></div>
      <span class="clab">Frame</span><div class="seg" id="seg-vp"><button data-v="full" class="on">Full</button><button data-v="tablet">Tablet</button></div>
    </div>
    <div class="stagewrap"><div class="frame" id="frame"><div class="screen" id="screen"></div></div></div>
  </main>
  <aside class="info" id="info"></aside>
</div>

<script>
(function(){
  "use strict";
  var P=function(d){return '<svg viewBox="0 0 24 24">'+d+'</svg>';};
